# Deploy automático do Duality na Vercel.
# Todo push nesta branch que toque em duality/ publica em https://duality-demo.vercel.app
# Requisito único (uma vez): segredo VERCEL_TOKEN no repositório
#   1. https://vercel.com/account/tokens → Create Token (escopo: ai-atelier-am-arin)
#   2. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      Nome: VERCEL_TOKEN · Valor: o token criado
name: deploy-duality

on:
  push:
    branches:
      - claude/gamification-monetization-redesign-lwb0za
    paths:
      - "duality/**"
      - ".github/workflows/deploy-duality.yml"
  workflow_dispatch:

concurrency:
  group: deploy-duality
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar segredo VERCEL_TOKEN
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VT" ]; then
            echo "::error::Falta o segredo VERCEL_TOKEN. Crie um token em https://vercel.com/account/tokens e adicione em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes
        working-directory: duality
        run: npm install && npm test

      - name: Deploy na Vercel (produção)
        working-directory: duality
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project duality-demo --scope ai-atelier-am-arin --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
